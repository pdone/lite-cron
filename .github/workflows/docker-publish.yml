name: Build and Push Docker Image to GHCR

on:
  # 推送 dev 分支时触发
  push:
    branches:
      - 'dev'
  # 当发布 release 时触发
  release:
    types: [published]
  # 手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (默认: latest)'
        required: false
        default: 'latest'

env:
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lite-cron

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # attestations: write
      # id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便检查分支

      - name: 验证 tag 来源
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "🏷️ Tag: $TAG_NAME"

          # 检查 tag 是否在 main 分支上
          git fetch origin main
          if git branch -a --contains $TAG_NAME | grep -q "remotes/origin/main"; then
            echo "✅ Tag 来自 main 分支，继续构建"
          else
            echo "⚠️ 警告: Tag 可能不是来自 main 分支"
            echo "包含此 tag 的分支:"
            git branch -a --contains $TAG_NAME
          fi

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 调试事件信息
        run: |
          echo "🔍 事件类型: ${{ github.event_name }}"
          echo "🔍 Ref: ${{ github.ref }}"
          echo "🔍 Ref 类型: ${{ github.ref_type }}"
          echo "🔍 Release Tag: ${{ github.event.release.tag_name || 'N/A' }}"

      - name: 提取 GitHub Container Registry 元数据
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          # 根据事件类型生成不同标签
          tags: |
            # dev 分支推送时，标签为 dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # release 发布时，生成 tag 名称和主版本号
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=match,event=tag,pattern=^v?(\d+),group=1,enable=${{ github.event_name == 'release' }}
            # 手动触发时，使用输入的标签（默认 latest）
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # release 发布时，生成 latest 标签
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          # 禁用默认的 sha 和 branch 标签
          flavor: |
            latest=auto

      - name: 提取 Docker Hub 元数据
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          # 根据事件类型生成不同标签
          tags: |
            # dev 分支推送时，标签为 dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # release 发布时，生成 tag 名称和主版本号
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=match,event=tag,pattern=^v?(\d+),group=1,enable=${{ github.event_name == 'release' }}
            # 手动触发时，使用输入的标签（默认 latest）
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # release 发布时，生成 latest 标签
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          flavor: |
            latest=auto

      - name: 显示生成的标签
        run: |
          echo "🏷️ GitHub Container Registry 标签:"
          echo "${{ steps.meta-ghcr.outputs.tags }}" | tr ',' '\n'
          echo ""
          echo "🏷️ Docker Hub 标签:"
          echo "${{ steps.meta-dockerhub.outputs.tags }}" | tr ',' '\n'

      - name: 构建并推送到 GitHub Container Registry
        id: push-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false


      - name: 构建并推送到 Docker Hub
        id: push-dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          provenance: false
          sbom: false

      # 注意：暂时禁用工件证明，因为它会推送额外的 sha256 标签到 registry
      # 如需启用，请确保配置正确或使用 GitHub 的默认证明存储
      # - name: 生成工件证明
      #   uses: actions/attest-build-provenance@v1
      #   with:
      #     subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: false

      - name: 输出镜像信息
        run: |
          echo "✅ 镜像构建并推送成功！"
          echo ""
          echo "📦 GitHub Container Registry:"
          echo "  镜像地址: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}"
          echo "  标签: ${{ steps.meta-ghcr.outputs.tags }}"
          echo "  Digest: ${{ steps.push-ghcr.outputs.digest }}"
          echo ""
          echo "📦 Docker Hub:"
          echo "  镜像地址: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}"
          echo "  标签: ${{ steps.meta-dockerhub.outputs.tags }}"
          echo "  Digest: ${{ steps.push-dockerhub.outputs.digest }}"
          echo ""
          echo "拉取命令:"
          echo "  docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:latest"
          echo "  docker pull ${{ env.DOCKERHUB_IMAGE_NAME }}:latest"
