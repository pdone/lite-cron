# 定时任务配置
# 时间格式: minute hour day-of-month month day-of-week
# 特殊值: * 表示任意值
# 示例: "*/5 * * * *" 表示每5分钟执行一次

# 共享代理地址（YAML 锚点）
# 用法: 在需要代理的任务 env 中写 `任务名_PROXY: *proxy` 引用此地址
# 修改下方地址即可统一更新所有引用处的代理，无需逐个任务修改
# 不需要代理时: 保持各任务的 *_PROXY 行为注释状态即可（不要删除此 proxy 定义，否则引用会解析失败）
proxy: &proxy "http://127.0.0.1:7890"

tasks:
  - name: "iKuuu"
    schedule: "0 2 * * *"
    script: "tasks/ikuuu.py"
    description: "iKuuu签到"
    enabled: true
    env:
      IKUUU_COOKIE: "your_cookie_here"          # 优先使用 Cookie 登录
      # IKUUU_EMAIL: "your_email"                # Cookie 失效时回退使用
      # IKUUU_PWD: "your_password"               # Cookie 失效时回退使用

  - name: "PTTime"
    schedule: "0 3 * * *"
    script: "tasks/pttime.py"
    description: "PTTime签到"
    enabled: true
    env:
      PTTIME_COOKIE: "your_cookie_here"
      PTTIME_UID: "your_uid_here"
      # PTTIME_PROXY: *proxy  # 可选，引用顶部 proxy 锚点

  - name: "SMZDM"
    schedule: "0 4 * * *"
    script: "tasks/smzdm.py"
    description: "什么值得买签到"
    enabled: true
    env:
      SMZDM_COOKIE: "your_smzdm_cookie_here"

  - name: "TieBa"
    schedule: "0 5 * * *"
    script: "tasks/tieba.py"
    description: "百度贴吧签到"
    enabled: true
    env:
      TIEBA_COOKIE: "BDUSS=your_bduss_here; other_cookie=xxx"

  - name: "FnClub"
    schedule: "0 6 * * *"
    script: "tasks/fnclub.py"
    description: "飞牛Nas论坛签到"
    enabled: true
    env:
      FNNAS_COOKIE: "your_cookie_here"

  - name: "AliyunPan"
    schedule: "0 7 * * *"
    script: "tasks/aliyunpan.py"
    description: "阿里云盘签到"
    enabled: true
    env:
      ALIYUN_REFRESH_TOKEN: "your_refresh_token_here"

  - name: "Bilibili"
    schedule: "0 8 * * *"
    script: "tasks/bilibili.py"
    description: "哔哩哔哩签到"
    enabled: true
    env:
      BILIBILI_COOKIE: "SESSDATA=xxx; bili_jct=xxx; DedeUserID=xxx; buvid3=xxx; buvid4=xxx; b_nutss=xxx"
      # ↑ 建议从浏览器导出完整 Cookie（包含 buvid3/buvid4/b_nutss 等设备指纹字段），
      #   分享接口风控必需；只有 SESSDATA+bili_jct 会导致分享任务返回「账号异常,操作失败」
      # BILIBILI_COIN_NUM: "5"                    # 每日投币数量，默认5
      # BILIBILI_SKIP_COIN: "false"               # 是否跳过投币任务: true/false，默认false（节省硬币）
      # BILIBILI_SKIP_SHARE: "false"              # 是否跳过分享任务: true/false，默认false
      # BILIBILI_SILVER2COIN: "false"             # 是否兑换银瓜子为硬币: true/false，默认false
      # BILIBILI_RECEIVE_VIP_PRIVILEGE: "false"   # 是否领取大会员权益: true/false，默认false
      # BILIBILI_COIN_FOLLOW: "false"             # 投币是否只给关注列表 UP 主: true/false，默认false
      # BILIBILI_WATCH_FOLLOW: "false"            # 观看是否只看关注列表 UP 主视频: true/false，默认false
      # BILIBILI_FOLLOW_SAMPLE: "10"             # 关注列表随机采样 UP 主数量（仅 follow 模式生效），默认10，越小请求越少

  - name: "V2EX"
    schedule: "0 9 * * *"
    script: "tasks/v2ex.py"
    description: "V2EX论坛签到"
    enabled: true
    env:
      V2EX_COOKIE: "your_v2ex_cookie_here"
      V2EX_PROXY: *proxy  # 可选，引用顶部 proxy 锚点
      # V2EX_SSL_VERIFY: "false"             # 可选，是否验证SSL证书，默认false

  - name: "NodeSeek"
    schedule: "0 10 * * *"
    script: "tasks/nodeseek.py"
    description: "NodeSeek论坛签到"
    enabled: true
    env:
      NODESEEK_COOKIE: "your_nodeseek_cookie_here"
      NODESEEK_RANDOM: "true"                # 可选，是否随机鸡腿: true/false，默认true
      # NODESEEK_PROXY: *proxy  # 可选，引用顶部 proxy 锚点

  - name: "ZhuTiX"
    schedule: "0 11 * * *"
    script: "tasks/zhutix.py"
    description: "致美化网站签到"
    enabled: true
    env:
      ZHUTIX_COOKIE: "your_zhutix_cookie_here"
      # ZHUTIX_PROXY: *proxy  # 可选，引用顶部 proxy 锚点

# 通知配置
notify:
  # 任务失败时发送通知
  on_failure: true
  # 任务成功时也发送通知
  on_success: false

  # Webhook 通知配置
  # 通知时会自动将 title 和 content 组合成请求体:
  # - application/json: {"title": "xxx", "content": "xxx"}
  # - application/x-www-form-urlencoded: title=xxx&content=xxx
  # - text/plain: xxx
  webhook:
    url: ""                    # Webhook URL
    method: "POST"             # HTTP 方法: GET, POST, PUT, PATCH
    content_type: "application/json"  # Content-Type: application/json, application/x-www-form-urlencoded, text/plain
    headers: |                 # 请求头，每行一个 key: value 格式
      # Authorization: Bearer your_token_here
      # X-API-Key: your_api_key_here

  # NTFY 通知配置
  ntfy:
    url: ""                    # NTFY 服务器地址，如 https://ntfy.sh
    topic: ""                  # NTFY Topic 名称
    priority: "3"              # 优先级: 1-5，1=最低，5=最高，默认3
    token: ""                  # 访问令牌（可选）
    username: ""               # 用户名（可选，与密码一起使用）
    password: ""               # 密码（可选）
    actions: ""                # 自定义动作（可选）
    headers: |                 # 自定义请求头，每行一个 key: value 格式（可选）
      # X-Custom-Header: value

# WebUI 配置
webui:
  debug: false                 # 是否启用 Flask 调试模式（true/false，默认false）
  # 鉴权令牌：设置后 WebUI 需登录（浏览器 /login 页）或携带 Authorization: Bearer <token> 才能访问
  # - 留空则关闭鉴权，此时 host 必须保持 127.0.0.1（默认）避免公网裸奔
  # - 推荐用环境变量 WEBUI_TOKEN 配置，避免明文写入本文件；环境变量优先级高于此处的值
  # token: "change-me-to-a-long-random-secret"
  # 绑定地址：默认 127.0.0.1（仅本地回环）
  # - 公网暴露须同时设置 token 并配合反向代理(HTTPS)；设为 0.0.0.0 但未配置 token 将拒绝启动
  # - 环境变量 WEBUI_HOST 优先级高于此处的值
  # host: "127.0.0.1"
  # 登录 Session 有效期（天）：默认 7；浏览器关闭后 Cookie 仍保留指定天数
  # - 仅在 token 已设置时生效；非法值（<=0 或非数字）自动回退为 7
  # - 环境变量 WEBUI_SESSION_DAYS 优先级高于此处的值
  # session_days: 7