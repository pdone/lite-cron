<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteCron</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="{{ url_for('static', filename='favicon.svg') }}" alt="LiteCron" class="logo-icon">
                    <div class="logo-text">
                        <h1><a href="https://github.com/pdone/lite-cron" target="_blank" rel="noopener noreferrer">LiteCron</a></h1>
                        <span class="logo-version">v{{ app_version }}</span>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="task-count">-</span>
                        <span class="stat-label">任务</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="toolbar">
                <button class="btn btn-secondary" id="btn-logs">
                    <span class="btn-icon">🔎</span>
                    查看日志
                </button>
                <button class="btn btn-refresh" id="btn-refresh" title="重载配置">
                    <span class="btn-icon">♻</span>
                    重载配置
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <span class="title-icon">📋</span>
                        定时任务
                    </h2>
                    <span class="badge" id="enabled-count">0 个启用</span>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="data-table" id="task-table">
                            <thead>
                                <tr>
                                    <th>状态</th>
                                    <th>任务名称</th>
                                    <th>调度规则</th>
                                    <th>描述</th>
                                    <th>下次执行</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="task-list">
                                <tr class="loading-row">
                                    <td colspan="6" class="loading-cell">
                                        <div class="spinner"></div>
                                        <span>加载中...</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mobile-task-list" id="mobile-task-list"></div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>LiteCron WebUI · <a href="https://github.com/pdone/lite-cron" target="_blank" rel="noopener noreferrer">项目主页</a></p>
        </footer>
    </div>

    <div class="modal" id="logs-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <span class="title-icon">📄</span>
                    日志文件
                </h3>
                <div class="modal-actions">
                    <button class="btn btn-sm btn-secondary" id="btn-clean" title="清理日志">
                        <span class="btn-icon">🧹</span>
                        清理日志
                    </button>
                    <button class="btn btn-sm btn-secondary" id="btn-maximize" title="最大化">
                        <span class="btn-icon">⛶</span>
                    </button>
                    <button class="modal-close" id="modal-close" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="logs-layout">
                    <div class="logs-sidebar">
                        <h4 class="sidebar-title">文件列表</h4>
                        <ul class="file-list" id="file-list">
                            <li class="file-item loading">加载中...</li>
                        </ul>
                    </div>
                    <div class="logs-content">
                        <div class="logs-toolbar">
                            <span class="logs-filename" id="current-filename">选择一个日志文件</span>
                            <button class="btn btn-sm" id="btn-download" disabled>下载</button>
                        </div>
                        <pre class="logs-viewer" id="logs-viewer"><code>点击左侧文件查看内容</code></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="run-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content modal-lg" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <span class="title-icon">🚀</span>
                    执行任务
                </h3>
                <button class="modal-close" id="run-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="run-info">
                    <span class="run-task-name" id="run-task-name"></span>
                    <span class="run-status" id="run-status">准备执行...</span>
                </div>
                <div class="terminal" id="terminal">
                    <div class="terminal-line system">等待开始...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

    <div class="modal" id="confirm-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content confirm-modal-content" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <span class="title-icon">⚠️</span>
                    确认操作
                </h3>
                <button class="modal-close" id="confirm-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="confirm-icon">⚠️</div>
                <div class="confirm-title" id="confirm-title">确定要执行此操作吗？</div>
                <div class="confirm-message" id="confirm-message"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirm-cancel">取消</button>
                <button class="btn btn-danger" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
