<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteCron</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="{{ url_for('static', filename='favicon.svg') }}" alt="LiteCron" class="logo-icon">
                    <div class="logo-text">
                        <h1><a href="https://github.com/pdone/lite-cron" target="_blank" rel="noopener noreferrer">LiteCron</a></h1>
                        <span class="logo-version">v{{ app_version }}</span>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="task-count">-</span>
                        <span class="stat-label">任务</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="toolbar">
                <button class="btn btn-secondary" id="btn-logs">
                    <i data-lucide="search" class="btn-icon"></i>
                    查看日志
                </button>
                <button class="btn btn-secondary"" id="btn-refresh" title="重载配置">
                    <i data-lucide="refresh-cw" class="btn-icon"></i>
                    重载配置
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i data-lucide="list-todo" class="title-icon"></i>
                        定时任务
                    </h2>
                    <span class="badge" id="enabled-count">0 个启用</span>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="data-table" id="task-table">
                            <thead>
                                <tr>
                                    <th>状态</th>
                                    <th>任务名称</th>
                                    <th>调度规则</th>
                                    <th>描述</th>
                                    <th>下次执行</th>
                                    <th class="col-actions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="task-list">
                                <tr class="loading-row">
                                    <td colspan="6" class="loading-cell">
                                        <div class="spinner"></div>
                                        <span>加载中...</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mobile-task-list" id="mobile-task-list"></div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>LiteCron WebUI · <a href="https://github.com/pdone/lite-cron" target="_blank" rel="noopener noreferrer">项目主页</a></p>
        </footer>
    </div>

    <div class="modal" id="logs-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i data-lucide="file-text" class="title-icon"></i>
                    日志文件
                </h3>
                <div class="modal-actions">
                    <button class="btn btn-sm btn-secondary" id="btn-clean" title="清理日志">
                        <i data-lucide="broom" class="btn-icon"></i>
                        清理日志
                    </button>
                    <button class="btn btn-sm btn-secondary" id="btn-maximize" title="最大化">
                        <i data-lucide="maximize-2" class="btn-icon"></i>
                    </button>
                    <button class="modal-close" id="modal-close" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="logs-layout">
                    <div class="logs-sidebar">
                        <h4 class="sidebar-title">文件列表</h4>
                        <ul class="file-list" id="file-list">
                            <li class="file-item loading">加载中...</li>
                        </ul>
                    </div>
                    <div class="logs-content">
                        <div class="logs-toolbar">
                            <span class="logs-filename" id="current-filename">选择一个日志文件</span>
                            <button class="btn btn-sm" id="btn-download" disabled>下载</button>
                        </div>
                        <pre class="logs-viewer" id="logs-viewer"><code>点击左侧文件查看内容</code></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="run-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content modal-lg" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i data-lucide="rocket" class="title-icon"></i>
                    执行任务
                </h3>
                <button class="modal-close" id="run-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="run-info">
                    <span class="run-task-name" id="run-task-name"></span>
                    <span class="run-status" id="run-status">准备执行...</span>
                </div>
                <div class="terminal" id="terminal">
                    <div class="terminal-line system">等待开始...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content modal-lg" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i data-lucide="pencil" class="title-icon"></i>
                    编辑任务
                </h3>
                <label class="switch" title="启用/禁用任务">
                    <input type="checkbox" id="edit-enabled" checked />
                    <span class="switch-track"></span>
                    <span class="switch-label">启用</span>
                </label>
                <button class="modal-close" id="edit-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form" class="edit-form" autocomplete="off">
                    <div class="masonry-grid">
                        <div class="form-field">
                            <label class="form-field-label" for="edit-name">
                                任务名称 <span class="required">*</span>
                            </label>
                            <input type="text" id="edit-name" class="form-control" placeholder="如：Bilibili" />
                            <span class="form-field-hint" id="edit-name-hint"></span>
                        </div>
                        <div class="form-field">
                            <label class="form-field-label" for="edit-description">
                                任务描述
                            </label>
                            <input type="text" id="edit-description" class="form-control" placeholder="如：Bilibili签到" />
                        </div>
                        <div class="form-field">
                            <label class="form-field-label" for="edit-script">
                                脚本文件路径 <span class="required">*</span>
                            </label>
                            <input type="text" id="edit-script" class="form-control mono" placeholder="tasks/v2ex.py" />
                            <span class="form-field-hint" id="edit-script-hint"></span>
                        </div>
                        <div class="form-field">
                            <label class="form-field-label" for="edit-schedule">
                                调度规则 (Cron) <span class="required">*</span>
                            </label>
                            <input type="text" id="edit-schedule" class="form-control mono" placeholder="0 2 * * *" />
                            <span class="form-field-hint" id="edit-schedule-hint"></span>
                            <div class="cron-preview" id="cron-preview" hidden>
                                <div class="cron-preview-item">
                                    <span class="cron-preview-label"><i data-lucide="clock" class="inline-icon"></i> 下次执行</span>
                                    <span class="cron-preview-value mono" id="cron-next-run">-</span>
                                </div>
                                <div class="cron-preview-item">
                                    <span class="cron-preview-label"><i data-lucide="info" class="inline-icon"></i> 规则说明</span>
                                    <span class="cron-preview-value" id="cron-desc">-</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-field env-field">
                        <div class="env-field-header">
                            <label class="form-field-label">环境变量</label>
                            <button type="button" class="btn btn-sm btn-primary" id="btn-add-env">
                                <span class="btn-icon">+</span>
                                添加变量
                            </button>
                        </div>
                        <div class="env-tip"><i data-lucide="link" class="inline-icon"></i> 标记为「共享变量」的条目引用了 YAML 锚点（如 <code>*proxy</code>），其值在多处共享。编辑值会改为字面量，删除则解除引用。</div>
                        <div class="env-list" id="env-list"></div>
                        <template id="env-row-template">
                            <div class="env-row">
                                <div class="env-key-col">
                                    <input type="text" class="env-key form-control mono" placeholder="KEY" />
                                </div>
                                <div class="env-value-col">
                                    <textarea class="env-value form-control mono" rows="1" placeholder="value"></textarea>
                                </div>
                                <button type="button" class="btn-icon-only env-remove" title="删除">&times;</button>
                            </div>
                        </template>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="edit-cancel">取消</button>
                <button class="btn btn-primary" id="edit-save">
                    <i data-lucide="save" class="btn-icon"></i>
                    保存并重载
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

    <div class="modal" id="confirm-modal">
        <div class="modal-overlay" aria-hidden="true"></div>
        <div class="modal-content confirm-modal-content" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i data-lucide="alert-triangle" class="title-icon"></i>
                    确认操作
                </h3>
                <button class="modal-close" id="confirm-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="confirm-icon"><i data-lucide="alert-triangle"></i></div>
                <div class="confirm-title" id="confirm-title">确定要执行此操作吗？</div>
                <div class="confirm-message" id="confirm-message"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirm-cancel">取消</button>
                <button class="btn btn-danger" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
